  in_h:"Before you start",in_p:"This is a game-like model of the brain's reward system. You choose what happens in a life and watch how dopamine and mood respond.",
  in_steps:["<b>Read the chart.</b> The teal curve is your dopamine level. The dark line is the norm: how much stimulation the body needs to feel OK. The coloured bands (euphoria, balance, depression…) move together with the norm.",
   "<b>Make a move.</b> The model starts in Day by day mode, paused. Pick a category on the right (pleasures, fantasies, wins, substances, losses, recovery) and press an event. That is today. If it has a rebound or consequences, the next day plays out by itself, then it is your move again.",
   "<b>Skip a day.</b> Press Next day to live a quiet day with no events.",
   "<b>Watch the norm.</b> Pile on pleasures and the norm creeps up. Now ordinary life sits below it and feels like a low. Sleep, sport, nature and therapy bring it back down slowly.",
   "<b>Hover the dots.</b> Point at a dot on the chart (or tap it on a phone) to see what happened that day.",
   "<b>Try ready-made lives.</b> The buttons above the chart run whole scenarios: a monk, an addict, a businessman, someone who drinks through pain and someone strong in spirit. Switch to Time runs to let time flow on its own."],
  in_wh:"Disclaimer.",in_w:"This is a simplified teaching model, not a medical or psychological tool. Real brains are far more complex, and the numbers are illustrative. It cannot diagnose anything or replace a doctor or therapist.",
  in_skip:"Don't show again",in_go:"Start",in_open:"How to use",
  m_auto:"Time runs",m_step:"Day by day",next:"Next day",yourmove:"your move",conseq:"living the consequences…",d_step:"Day by day: each press is one day. If the event has a rebound or consequences, the next day plays out on its own. Then it is your move again. Press Next day to live a quiet day.",hint:"Tip: hover or tap a dot on the chart to see what happened.",tl_norm:"Norm line",tip_now:"Right now",tl_normd:"How much stimulation the body needs right now just to feel OK. It rises when you chase strong pleasures and slowly falls with rest, sport, sleep and therapy. The coloured zones move with it.",
  tl_rest:"Natural rest level",tl_restd:"Where dopamine sits with no stimulation at all. When the norm rises above this line, a quiet ordinary day starts to feel like a low.",
  tips_open:"Tips for a calm life",tips_h:"Tips for a calm, pleasant life",tips_ph:"Patterns the model shows",tips_hh:"What helps",tips_close:"Got it",
  tips_p:["<b>Every rise is paid for with a fall.</b> The faster and stronger the rise, the deeper the dip after it.",
   "<b>The less healthy the cause, the sadder the fall.</b> Substances and empty fantasies give a quick high and a long, heavy come-down. Joys you earn with effort (sport, craft, real progress) lift you more gently and leave almost no rebound.",
   "<b>Chasing highs raises the norm.</b> Then ordinary life feels grey, and you need more and more just to feel OK.",
   "<b>Being high doesn't protect you from a blow.</b> A big loss cuts through any high, and the higher you were on cheap stimulation, the longer the fall.",
   "<b>The longer you stay low, the stickier it gets.</b> Act early, while it is still a low and not yet depression."],
  tips_h2:["<b>Choose slow pleasures.</b> Walks, nature, friends, craft, sport. They lift you without pushing the norm up.",
   "<b>Earn the reward.</b> Do the thing first, enjoy it after. Effort makes dopamine work for you.",
   "<b>Keep cheap hits rare.</b> Endless scrolling, motivational videos without action, sugar, alcohol: treat them as occasional treats, not daily fuel.",
   "<b>Turn a dream into one small step today.</b> A dream with action is fuel. A dream instead of action is a sugar rush.",
   "<b>Protect your sleep.</b> It quietly resets the system every night.",
   "<b>Take breaks from stimulation.</b> A day without screens feels boring at first. That boredom is the norm going back down.",
   "<b>After a blow, don't numb it.</b> Move your body, talk to someone, go outside. If the low lasts for weeks, get professional help.",
   "<b>Don't stay alone in a low.</b> Reach out to people. Depression lies that nobody cares."],
  tip_peak:"Strength",tip_need:"Norm at that moment",tip_feel:"Feeling"},
 ua:{title:"Дофамінові гойдалки",subtitle:"Інтерактивна модель системи винагороди мозку. Наповнюйте життя радощами й ударами і дивіться, як високо злітає крива, як низько падає і як сама норма повзе вгору.",

  r_feel:"Як ви почуваєтесь",r_norm:"Зсув норми",r_sens:"Чутливість до радості",r_drag:"Затягування в депресію",

  g_joy:"Звичайні радощі",g_fan:"Фантазії",g_win:"Великі перемоги",g_sub:"Речовини",g_loss:"Втрати",g_care:"Відновлення",
  p_calm:"Спокійне життя",p_monk:"Монах у Тибеті",p_dream:"Мрійник без дій",p_dreamok:"Мрійник, що діє",p_biz:"Бізнесмен",p_alco:"Заливає біль алкоголем",p_strong:"Сильний духом",p_addict:"Наркозалежність",p_star:"Слава рок-зірки",p_grief:"Горе і відновлення",p_free:"Вільний режим",
  d_calm:"Рівне життя: помірні радощі, кілька невдач, одне підвищення. Норма майже не рухається, тож крива тримається біля рівноваги і сама відновлюється.",
  d_monk:"Самообмеження і щоденна медитація. Норма стоїть на нулі, тож навіть прогулянка чи добре слово відчуваються яскраво. Втрата теж болить, але розум швидше повертається до спокою.",
  d_dream:"Мотиваційні ролики, мрії перед сном про велич, солодкі фантазії щодня і мало реальних дій. Кожна мрія як маленький цукровий сплеск зі спадом після нього, а норма потроху росте, і реальне життя стає пласким.",
  d_dreamok:"Спочатку ті самі мрії, але з 30-го дня вони перетворюються на тренування, справу і сон. Реальний прогрес приносить іспит, гарну роботу і підвищення. Мрії майже нічого не коштують, бо зусилля тримають норму внизу.",
  d_biz:"Постійні досягнення: похвала, угоди, гроші, підвищення, слава і алкоголь на ділових вечерях. Кожна перемога піднімає норму, тож наступна має бути більшою. Коли угода провалюється і партнер зраджує, падіння з високої норми дуже глибоке.",
  d_alco:"Життя завдає п'ять ударів: втрата роботи, розбите серце, втрата грошей, смерть, зрада. Після кожного він п'є тижнями, і щоразу трохи більше. Норма росте, спади глибшають, і кожен новий удар приходить на нижчий рівень.",
  d_strong:"Рівно ті самі п'ять ударів. Після кожного: спорт через день, чесні розмови, природа, сон, а після смерті терапія. Біль такий самий гострий, але норма лишається внизу, і кожне відновлення швидше.",
  d_addict:"Травка на вихідних, потім кокаїн, потім героїн. Перші кайфи дають ейфорію, кожен наступний менший, а норма злітає, тож тверезе життя опиняється глибоко під нею. З 300-го дня: без наркотиків, спорт, сон і щотижнева терапія. Подивіться, як повільно норма опускається.",
  d_star:"Раптова слава, гроші, постійне свято, потім речовини, щоб утримати це відчуття. Норма піднімається так високо, що навіть нова слава майже не відчувається, а розрив на дні б'є дуже сильно.",
  d_grief:"Помирає близька людина, потім втрата роботи. Настрій падає в депресію і застрягає. Постійна підтримка, друзі й час поступово витягують назад.",
  d_free:"Вільний режим: час іде, і нічого не стається, поки ви не натиснете кнопку нижче. Спробуйте накидати багато радощів і подивіться, як піднімається лінія норми.",
  i_crisis:"Крива в зоні кризи. У реальному житті саме тут людині потрібні інші люди і фахова допомога, а не лише сила волі.",
  i_norm:"Норма піднялась на {n}. Без нового «вкиду» звичайне життя тепер нижче за неї і відчувається як спад.",
  i_drag:"Поганий настрій затягує: чим довше крива внизу, тим повільніше вона піднімається.",
  i_sens:"Толерантність: радощі тепер відчуваються лише на {p}% від початкової сили.",
  i_high:"Цей кайф позичений. Відкат уже наростає, і після нього прийде спад.",
  how_h:"Як працює модель",
  how:["<b>У кожної радості є відкат.</b> Радість піднімає дофамін, а мозок відповідає повільнішим зворотним поштовхом, щоб повернути рівновагу. Це і є відхідняк. Що вищий злет, то глибший спад, навіть після фантазій і соцмереж.",
   "<b>Норма повзе вгору.</b> Часта сильна стимуляція привчає тіло її чекати. Лінія норми піднімається, а разом з нею і всі зони. Тепер потрібно більше стимулів, щоб просто почуватись ок.",
   "<b>Толерантність.</b> Та сама подія щоразу дає менший злет. Норма росте, а злети меншають.",
   "<b>Великі удари пробивають будь-який кайф.</b> Втрата роботи, розбите серце, зрада, приниження, втрата грошей чи близької людини обнуляють поточний злет і штовхають до депресії. Закоханість лише трохи пом'якшує удар, а розбите серце саму закоханість і обриває.",
   "<b>Липка депресія.</b> Чим довше настрій у депресії, тим важче з неї вийти. Сон, медитація, терапія, чесні розмови і час повільно опускають норму назад."],
  help_h:"Якщо це звучить знайомо",
  help_1:"Якщо у вас або у когось поруч є думки, що не хочеться жити, будь ласка, зверніться по допомогу. Україна: 7333 (Lifeline Ukraine). США: дзвінок або SMS на 988. В інших країнах: місцевий номер екстреної допомоги.",
  help_2:"Депресія і залежність лікуються. У цій моделі крива завжди має шлях угору, і в людей теж.",
  disclaimer:"Спрощена навчальна модель на основі теорії протидіючих процесів і ідеї гедонічного базового рівня. Числа ілюстративні, це не медичні дані.",
  in_h:"Перед початком",in_p:"Це модель-гра про систему винагороди мозку. Ви вирішуєте, що стається в житті, і дивитесь, як на це реагують дофамін і настрій.",
  in_steps:["<b>Як читати графік.</b> Бірюзова крива це рівень дофаміну. Темна лінія це норма: скільки стимуляції треба тілу, щоб почуватись ок. Кольорові зони (ейфорія, рівновага, депресія…) рухаються разом з нормою.",
   "<b>Зробіть хід.</b> Модель стартує в режимі «День за днем» на паузі. Оберіть праворуч категорію (радощі, фантазії, перемоги, речовини, втрати, відновлення) і натисніть подію. Це сьогоднішній день. Якщо в події є відкат чи наслідки, наступний день проживається сам, а потім знову ваш хід.",
   "<b>Пропустіть день.</b> «Наступний день» означає спокійний день без подій.",
   "<b>Стежте за нормою.</b> Накидайте багато радощів, і норма поповзе вгору. Тоді звичайне життя опиниться під нею і відчуватиметься як спад. Сон, спорт, природа і терапія повільно повертають її вниз.",
   "<b>Наводьте на точки.</b> Наведіть мишку на точку на графіку (або тапніть на телефоні), щоб побачити, що сталося того дня.",
   "<b>Спробуйте готові життя.</b> Кнопки над графіком запускають цілі сценарії: монах, наркозалежний, бізнесмен, людина, що заливає біль алкоголем, і сильний духом. Перемкніть на «Час іде сам», щоб час плив сам."],
  in_wh:"Дисклеймер.",in_w:"Це спрощена навчальна модель, а не медичний чи психологічний інструмент. Справжній мозок набагато складніший, а числа ілюстративні. Модель нічого не діагностує і не замінює лікаря чи психотерапевта.",
  in_skip:"Більше не показувати",in_go:"Почати",in_open:"Як користуватись",
  m_auto:"Час іде сам",m_step:"День за днем",next:"Наступний день",yourmove:"ваш хід",conseq:"проживаємо наслідки…",d_step:"День за днем: кожне натискання це один день. Якщо в події є відкат чи наслідки, наступний день проживається автоматично. Потім знову ваш хід. «Наступний день» означає спокійний день без подій.",hint:"Порада: наведіть або тапніть на точку на графіку, щоб побачити, що сталося.",tl_norm:"Лінія норми",tip_now:"Зараз",tl_normd:"Скільки стимуляції тілу треба саме зараз, щоб просто почуватись ок. Вона росте, коли гонишся за сильними радощами, і повільно опускається від відпочинку, спорту, сну і терапії. Кольорові зони рухаються разом з нею.",
  tl_rest:"Природний рівень спокою",tl_restd:"Де знаходиться дофамін без жодної стимуляції. Коли норма піднімається вище цієї лінії, спокійний звичайний день починає відчуватись як спад.",
  tips_open:"Поради для спокійного життя",tips_h:"Поради для спокійного і приємного життя",tips_ph:"Закономірності, які показує модель",tips_hh:"Що допомагає",tips_close:"Зрозуміло",
  tips_p:["<b>За кожен злет платиш падінням.</b> Що швидший і сильніший підйом, то глибший спад після нього.",
   "<b>Що менш здорова причина підйому, то печальніший спад.</b> Речовини і пусті фантазії дають швидкий кайф і довгий важкий відхідняк. Радощі, зароблені зусиллям (спорт, справа, реальний прогрес), піднімають м'якше і майже не дають відкату.",
   "<b>Погоня за кайфом піднімає норму.</b> Потім звичайне життя здається сірим, і треба все більше, щоб просто почуватись ок.",
   "<b>Кайф не захищає від удару.</b> Велика втрата пробиває будь-який злет, і що вище ти був на дешевій стимуляції, то довше падіння.",
   "<b>Чим довше внизу, тим сильніше затягує.</b> Дійте рано, поки це ще спад, а не депресія."],
  tips_h2:["<b>Обирайте повільні радощі.</b> Прогулянки, природа, друзі, справа, спорт. Вони піднімають настрій, не штовхаючи норму вгору.",
   "<b>Заробляйте винагороду.</b> Спочатку зробіть, потім насолоджуйтесь. Зусилля змушує дофамін працювати на вас.",
   "<b>Дешеві «дози» рідко.</b> Нескінченні стрічки, мотиваційні ролики без дій, цукор, алкоголь: як рідкісні ласощі, а не щоденне паливо.",
   "<b>Перетворіть мрію на один маленький крок сьогодні.</b> Мрія з дією це паливо. Мрія замість дії це цукровий сплеск.",
   "<b>Бережіть сон.</b> Він щоночі тихо перезавантажує систему.",
   "<b>Робіть перерви від стимуляції.</b> День без екранів спочатку нудний. Ця нудьга і є норма, що опускається.",
   "<b>Після удару не глушіть біль.</b> Рухайтесь, поговоріть з кимось, вийдіть надвір. Якщо спад тримається тижнями, зверніться до фахівця.",
   "<b>Не лишайтесь на самоті в спаді.</b> Тягніться до людей. Депресія бреше, що всім на вас байдуже."],
  tip_peak:"Сила",tip_need:"Норма в цей момент",tip_feel:"Самопочуття"}
};

  ctx.strokeStyle=css("--norm");ctx.globalAlpha=.75;ctx.lineWidth=1.8;ctx.beginPath();h.forEach((p,i)=>{const x=X(p[0]),y=Y(p[2]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.globalAlpha=1;
  // level trace
  ctx.strokeStyle=css("--trace");ctx.lineWidth=2.8;ctx.lineJoin="round";ctx.lineCap="round";ctx.beginPath();ctx.moveTo(X(h[0][0]),Y(h[0][1]));
  for(let i=1;i<h.length-1;i++){const xc=(X(h[i][0])+X(h[i+1][0]))/2,yc=(Y(h[i][1])+Y(h[i+1][1]))/2;ctx.quadraticCurveTo(X(h[i][0]),Y(h[i][1]),xc,yc)}
  const hl=h[h.length-1];ctx.lineTo(X(hl[0]),Y(hl[1]));ctx.stroke();
  ctx.fillStyle=ink;ctx.beginPath();ctx.arc(X(hl[0]),Y(hl[1]),4.5,0,7);ctx.fill()}
 // event marks
 const vis=S.marks.filter(m=>m.t>=x0&&m.t<=x1);
 const showLabels=vis.length<=14;
 ctx.font="500 10.5px "+css("--f-body");ctx.textAlign="left";const lastX=[-1e9,-1e9];
 for(const m of vis){const e=EV[m.id],x=X(m.t),col=css("--c-"+e.g);
  const hp=nearestHist(m.t+.6*Math.max(e.tau,.8));
  const isH=hover&&hover.mark===m;
  ctx.strokeStyle=col;ctx.globalAlpha=isH?.8:.22;ctx.lineWidth=isH?1.5:1;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bot);ctx.stroke();ctx.globalAlpha=1;
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,top,isH?5:3.5,0,7);ctx.fill();
  if(hp){ctx.beginPath();ctx.arc(X(hp[0]),Y(hp[1]),isH?5:3,0,7);ctx.fill()}
  if(showLabels){const label=e[lang][0],w=ctx.measureText(label).width;
   for(let r=0;r<2;r++){if(x>lastX[r]+6){ctx.fillText(label,Math.min(x+5,R-w),r?25:13);lastX[r]=x+w+5;break}}}}
 // crosshair
 if(hover&&!hover.mark&&hover.hp&&!hover.line){const x=X(hover.hp[0]);ctx.strokeStyle=ink;ctx.globalAlpha=.35;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bot);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle=ink;ctx.beginPath();ctx.arc(x,Y(hover.hp[1]),4,0,7);ctx.fill()}
}
function nearestHist(t){const h=S.hist;if(!h.length)return null;let lo=0,hi=h.length-1;if(t>h[hi][0])return null;while(hi-lo>1){const m=(lo+hi)>>1;if(h[m][0]<t)lo=m;else hi=m}return h[hi]}

function fmtS(v){v=Math.round(v);return (v>0?"+":"")+v}
function showTip(px,py){if(!geo){tip.hidden=true;return}
 const {X,Y,top}=geo,t=T[lang];let best=null,bd=10;
 for(const m of S.marks){const d=Math.abs(X(m.t)-px);if(d>=bd)continue;const hp=nearestHist(m.t+.6*Math.max(EV[m.id].tau,.8));const nearDot=hp&&Math.hypot(X(hp[0])-px,Y(hp[1])-py)<14;if(py<top+30||nearDot){bd=d;best=m}}
 let html;
 const tt=geo.x0+(px-geo.L)/(geo.R-geo.L)*(geo.x1-geo.x0);let hp=nearestHist(tt);
 const pastEnd=!hp&&px>=geo.L&&px<=geo.R;const nNow=hp?hp[2]:S.norm;
 if(best){const e=EV[best.id];hover={mark:best};
  html=`<b>${e[lang][0]}</b><div class="m">${t.day} ${Math.floor(best.t)} · ${t["g_"+e.g]} · ${t.tip_peak} ${e.amp>0?"+":""}${e.amp}</div><div class="d">${e[lang][1]}</div><div class="m" style="margin-top:6px;margin-bottom:0">${t.tip_need}: ${fmtS(best.need)}</div>`}
 else if((hp||pastEnd)&&Math.abs(Y(nNow)-py)<9){hover=hp?{hp,line:1}:null;
  html=`<b>${t.tl_norm}</b><div class="m">${t.tip_now}: ${fmtS(nNow)}</div><div class="d">${t.tl_normd}</div>`}
 else if((hp||pastEnd)&&Math.abs(Y(0)-py)<7){hover=null;
  html=`<b>${t.tl_rest}</b><div class="d">${t.tl_restd}</div>`}
 else{
  if(!hp||px<geo.L||px>geo.R){hover=null;tip.hidden=true;draw();return}
  hover={hp};const z=zoneOf(hp[1]-hp[2]);
  html=`<div class="m" style="margin-bottom:2px">${t.day} ${Math.floor(hp[0])} · ${t.lg_level}</div><b>${t["z_"+z[2]]}</b><div class="m" style="margin:0">${t.tip_need}: ${fmtS(hp[2])}</div>`}
 tip.innerHTML=html;tip.hidden=false;
 const bw=cv.parentElement.clientWidth,tw=tip.offsetWidth,th=tip.offsetHeight;
 let lx=px+14;if(lx+tw>bw-4)lx=px-tw-14;if(lx<4)lx=4;
 let ly=py-th-12;if(ly<4)ly=py+16;
 tip.style.left=lx+"px";tip.style.top=ly+"px";draw()}
cv.addEventListener("pointermove",e=>{const r=cv.getBoundingClientRect();showTip(e.clientX-r.left,e.clientY-r.top)});
cv.addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect();showTip(e.clientX-r.left,e.clientY-r.top)});
cv.addEventListener("pointerleave",()=>{hover=null;tip.hidden=true;draw()});

const $=id=>document.getElementById(id);
function ui(){const t=T[lang];
 const dn=$("daynum");if(mode==="step"){const busy=stepTarget!==null;dn.textContent=t.day+" "+(Math.round(S.t)+1)+" · "+(busy?t.conseq:t.yourmove);dn.classList.toggle("busy",busy)}else{dn.textContent=t.day+" "+Math.floor(S.t)+(S.p.dur?" / "+S.p.dur:"");dn.classList.remove("busy")}
 const felt=S.lvl-S.norm,z=zoneOf(felt),sens=Math.round(100/(1+.25*S.tol));
 $("v-feel").textContent=t["z_"+z[2]];$("v-dot").style.background="var("+z[3]+")";
 const nr=Math.round(S.norm);$("v-norm").textContent=nr<=0?t.same:"+"+nr+" "+t.above;
 $("v-sens").textContent=sens+"%";$("b-sens").style.width=sens+"%";
 const dg=Math.round(S.g/22*100);$("v-drag").textContent=dg+"%";$("b-drag").style.width=dg+"%";
 let msg=mode==="step"?t.d_step:t["d_"+pid],warn=false;const lm=S.marks[S.marks.length-1];
 if(felt<-60){msg=t.i_crisis;warn=true}
 else if(felt>45&&lm&&(EV[lm.id].g==="sub"||EV[lm.id].g==="fan")&&S.t-lm.t<4){msg=t.i_high}
 else if(S.norm>20&&felt<-15){msg=t.i_norm.replace("{n}",nr)}
 else if(S.g>8){msg=t.i_drag}
 else if(sens<60){msg=t.i_sens.replace("{p}",sens)}
 const ins=$("insight");if(ins.textContent!==msg)ins.textContent=msg;ins.classList.toggle("warn",warn);
 $("play").textContent=playing?t.pause:t.play;$("play").hidden=mode==="step";$("speedbox").hidden=mode==="step";$("next").hidden=mode!=="step";$("next").disabled=stepTarget!==null;$("m-auto").setAttribute("aria-pressed",mode==="auto");$("m-step").setAttribute("aria-pressed",mode==="step")}

function renderStatic(){const t=T[lang];document.documentElement.lang=lang==="ua"?"uk":"en";
 document.querySelectorAll("[data-t]").forEach(el=>{el.textContent=t[el.dataset.t]});
 $("how").innerHTML=t.how.map(s=>"<li>"+s+"</li>").join("");
 $("tips-p").innerHTML=t.tips_p.map(s=>"<li>"+s+"</li>").join("");$("tips-h2").innerHTML=t.tips_h2.map(s=>"<li>"+s+"</li>").join("");
 $("intro-steps").innerHTML=t.in_steps.map(s=>"<li>"+s+"</li>").join("");
 $("ilang-en").setAttribute("aria-pressed",lang==="en");$("ilang-ua").setAttribute("aria-pressed",lang==="ua");
 $("lang-en").setAttribute("aria-pressed",lang==="en");$("lang-ua").setAttribute("aria-pressed",lang==="ua");
 $("presets").innerHTML=PRESET_ORDER.map(id=>`<button data-p="${id}" aria-pressed="${id===pid}">${t["p_"+id]}</button>`).join("");
 renderKeys();
 $("speedv").textContent=speed+(lang==="ua"?" дн/с":" d/s");
 ui();draw()}

let tab="joy";try{const s=localStorage.getItem("dopa-tab");if(GROUPS.includes(s))tab=s}catch(e){}
function renderKeys(){const t=T[lang];
 $("tabs").innerHTML=GROUPS.map(g=>`<button class="tab" role="tab" data-g="${g}" aria-selected="${g===tab}"><i style="background:var(--c-${g})"></i>${t["g_"+g]}</button>`).join("");
 $("keys").innerHTML=Object.keys(EV).filter(k=>EV[k].g===tab).map(k=>`<button class="key" style="--kc:var(--c-${tab})" data-e="${k}" title="${EV[k][lang][1].replace(/"/g,"&quot;")}">${EV[k][lang][0]}<span>${EV[k].amp>0?"+":""}${EV[k].amp}</span></button>`).join("")}
function load(id,pre){pid=id;S=newState(id);if(pre)advance(pre);playing=true;hover=null;tip.hidden=true;renderStatic()}
function toFree(){pid="free";S.p=P.free;S.sched=[];S.sp=0;renderStatic()}

$("presets").addEventListener("click",e=>{const b=e.target.closest("[data-p]");if(b){mode="auto";stepTarget=null;load(b.dataset.p,0)}});
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-g]");if(!b)return;tab=b.dataset.g;try{localStorage.setItem("dopa-tab",tab)}catch(_){}renderKeys()});
$("keys").addEventListener("click",e=>{const b=e.target.closest("[data-e]");if(!b)return;
 if(S.p.dur&&S.t>=S.p.dur)toFree();
 if(mode==="step"){finishStep();const e=EV[b.dataset.e];fire(b.dataset.e);const needs=e.amp<0||(e.opp||0)*OPPF[e.g]>.2;stepTarget=Math.round(S.t)+(needs?2:1);ui();return}
 fire(b.dataset.e);playing=true;ui();draw()});
function finishStep(){if(stepTarget!==null){advance(Math.max(0,stepTarget-S.t));stepTarget=null}}
function setMode(m){mode=m;finishStep();if(m==="step"){if(pid!=="free"||S.p.dur)toFree();playing=false;S.t=Math.round(S.t)}else{playing=true}ui();draw()}
$("m-auto").onclick=()=>setMode("auto");$("m-step").onclick=()=>setMode("step");
$("next").onclick=()=>{if(stepTarget!==null)return;stepTarget=Math.round(S.t)+1;ui()};
$("play").onclick=()=>{if(S.p.dur&&S.t>=S.p.dur)load(pid,0);else playing=!playing;ui()};
$("reset").onclick=()=>{stepTarget=null;load(pid,0);if(mode==="step"){playing=false;ui()}};
$("speed").oninput=e=>{speed=+e.target.value;$("speedv").textContent=speed+(lang==="ua"?" дн/с":" d/s")};
function setLang(l){lang=l;try{localStorage.setItem("dopa-lang",l)}catch(e){}renderStatic()}
$("lang-en").onclick=()=>setLang("en");$("lang-ua").onclick=()=>setLang("ua");
$("ilang-en").onclick=()=>setLang("en");$("ilang-ua").onclick=()=>setLang("ua");
function closeIntro(){$("intro").hidden=true;try{if($("intro-skip").checked)localStorage.setItem("dopa-intro","off");else localStorage.removeItem("dopa-intro")}catch(e){}}
$("intro-go").onclick=closeIntro;
$("intro").addEventListener("click",e=>{if(e.target.id==="intro")closeIntro()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("intro").hidden)closeIntro()});
$("tipsbtn").onclick=()=>{$("tips").hidden=false;$("tips-go").focus()};
$("tips-go").onclick=()=>{$("tips").hidden=true};
$("tips").addEventListener("click",e=>{if(e.target.id==="tips")$("tips").hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("tips").hidden=true});
$("howto").onclick=()=>{$("intro").hidden=false;$("intro-go").focus()};
(function(){let off=false;try{off=localStorage.getItem("dopa-intro")==="off"}catch(e){}if(!off){$("intro").hidden=false;setTimeout(()=>$("intro-go").focus(),50)}else $("intro-skip").checked=true})();
window.addEventListener("resize",draw);
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",draw)}catch(e){}
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});

let last=performance.now();
function loop(now){const dts=Math.min(.1,(now-last)/1000);last=now;
 if(mode==="step"){if(stepTarget!==null){const rem=stepTarget-S.t;if(rem<=1e-6){S.t=stepTarget;stepTarget=null}else advance(Math.min(rem,3*dts));ui();draw()}}
 else if(playing){advance(speed*dts);ui();draw()}
 requestAnimationFrame(loop)}
load("free",0);setMode("step");requestAnimationFrame(loop);
})();
</script>
</body>
